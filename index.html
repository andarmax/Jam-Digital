<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL v2.2 - Andar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
- { margin: 0; padding: 0; box-sizing: border-box;}
body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #000; font-family: 'VT323', monospace; overflow: hidden; color: #;}
#wallpaper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -3; opacity: 0.25; filter: blur(1px) brightness(0.3); display: none;}
#matrix { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.08;}
body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(transparent 50%, rgba(0, 255, 65, 0.02) 50%); background-size: 100% 3px; animation: scanline 10s linear infinite; pointer-events: none; z-index: -1;}
@keyframes scanline { 0% { transform: translateY(0);} 100% { transform: translateY(100vh);}}
#lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center;}
.lock-title { font-size: 28px; margin-bottom: 30px; letter-spacing: 4px;}
.lock-input { background: #; border: 1px solid #; color: #; font-family: 'VT323', monospace; font-size: 22px; padding: 10px 20px; width: 280px; text-align: center; outline: none;}
.lock-btn { margin-top: 20px; background: transparent; border: 1px solid #; color: #; font-family: 'VT323', monospace; font-size: 18px; padding: 8px 30px; cursor: pointer;}
.lock-btn:hover { background: #; color: #000;}
.lock-error { color: #; margin-top: 15px; font-size: 16px; opacity: 0; transition: opacity 0.3s;}
.lock-error.show { opacity: 1;}
.container { text-align:center;padding35px45px;backgroundrgba(020,.92);border1solid#;max-width680px;width90%;display:none;position:relative;}
.container::before { content:'[root@terminal ~]#'; position:absolute; top:-12px; left20px;background:#000;padding010px;font-size13px;}
.nama{font-size22px;margin-bottom15px;letter-spacing4px;}
.waktu{font-sizeclamp(36px,7vw,64px);margin-bottom8px;}
.tanggal{font-size14px;color:#;letter-spacing2px;margin-bottom20px;}
.info-grid{display:grid;grid-template-columnsrepeat(auto-fit,minmax(160px,1fr));gap8px;margin-bottom15px;font-size12px;text-align:left;color:#}
.info-item{background:#;padding6px;border-left2solid#}
.info-label{color:#;display:block;margin-bottom2px;font-size11px}
.command-line{background:#;border-top1solid#;padding-top12px;margin-top12px;text-align:left}
.cmd-input{width100%;background:#000;border:none;color:#;font-family:'VT323';font-size14px;padding6px;outline:none}
.cmd-input::placeholder{color:#006622}
.log-container{height110px;overflow-y:auto;background:#000;padding8px;margin-top8px;border1solid#003300;font-size11px;text-align:left;color:#}
.log-entry{margin-bottom2px}
.status{margin-top12px;font-size12px}
.status span{display:inline-block;width6px;height6px;background:#;border-radius50%;margin-right5px}
.btn-group{display:flex;gap8px;margin-top8px;justify-content:center}
.btn{background:#;border1solid#;color:#;padding4-8px;font-size11px;cursor:pointer;font-family:'VT323'}
.btn:hover{background:#003300}
.theme-toggle{position:absolute;top10px;right10px;background:#;border1solid#;color:#;padding4-8px;font-size11px;cursor:pointer}
.theme-toggle:hover{background:#003300}
/_ Red Theme _/
body.red-theme{background:#110000}
body.red-theme.container{border-color:#}
body.red-theme.nama,.red-theme.waktu,.red-theme.status,.red-theme.theme-toggle,.red-theme.btn{color:#}
body.red-theme.info-label,.red-theme.cmd-input,.red-theme.log-container{color:#}
body.red-theme.info-item,.red-theme.command-line{background:#;border-left-color:#}
/_ Blue Theme _/
body.blue-theme{background:#000011}
body.blue-theme.container{border-color:#}
body.blue-theme.nama,.blue-theme.waktu,.blue-theme.status,.blue-theme.theme-toggle,.blue-theme.btn{color:#}
body.blue-theme.info-label,.blue-theme.cmd-input,.blue-theme.log-container{color:#}
body.blue-theme.info-item,.blue-theme.command-line{background:#;border-left-color:#}
@media(max-width600){.container{padding25-15}.waktu{font-size44}.nama{font-size18}.info-grid{grid-template-columns1fr}}
</style>
</head>
<body>
<img id="wallpaper" alt="">
<canvas id="matrix"></canvas>

<div id="lockScreen">
<div class="lock-title">ACCESS RESTRICTED</div>
<input type="password" class="lock-input" id="passwordInput" placeholder="ENTER PASSWORD" autocomplete="off" autofocus>
<button class="lock-btn" onclick="checkPassword()">AUTHENTICATE</button>
<div class="lock-error" id="lockError">ACCESS DENIED</div>
</div>

<div class="container" id="mainContainer">
<button class="theme-toggle" onclick="toggleTheme()">THEME</button>
<div class="nama">ANDAR</div>
<div class="waktu" id="jam">00</div>
<div class="tanggal" id="tanggal">MONDAY,01 JANUARY2026</div>

<div class="info-grid">
<div class="info-item"><span class="info-label">IP ADDRESS</span><span id="ip">LOADING...</span></div>
<div class="info-item"><span class="info-label">LOCATION</span><span id="location">SCANNING...</span></div>
<div class="info-item"><span class="info-label">BATTERY</span><span id="battery">CHECKING...</span></div>
<div class="info-item"><span class="info-label">UPTIME</span><span id="uptime">00</span></div>
</div>

<div class="command-line">
<input type="text" class="cmd-input" id="cmdInput" placeholder="$ type 'help' for commands" onkeypress="handleCmd(event)">
<div class="log-container" id="logContainer"></div>
</div>

<div class="btn-group">
<button class="btn" onclick="exportLog()">EXPORT LOG</button>
<button class="btn" onclick="document.getElementById('wallpaperInput').click()">WALLPAPER</button>
<input type="file" id="wallpaperInput" accept="image/*" style="display:none" onchange="setWallpaper(event)">
<button class="btn" onclick="clearLog()">CLEAR LOG</button>
</div>

<div class="status"><span></span>SYSTEM ONLINE</div>
</div>
