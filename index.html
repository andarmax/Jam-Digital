<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TERMINAL v2.4 FIXED - Andar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center;align-items:center;min-height:100dvh;background:#000;font-family:'VT323',monospace;overflow:hidden;color:#00ff41;padding:12px}
#wallpaper{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-3;opacity:.25;filter:blur(1px) brightness(.3);display:none}
#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;opacity:.08}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(transparent 50%,rgba(0,255,65,.02) 50%);background-size:100% 3px;pointer-events:none;z-index:-1}
#lockScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:10000;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
.lock-title{font-size:28px;margin-bottom:30px;letter-spacing:4px;text-shadow:0 0 15px #00ff41}
.lock-input{background:#001100;border:1px solid #00ff41;color:#00ff41;font-family:'VT323',monospace;font-size:22px;padding:12px 20px;width:280px;max-width:90%;text-align:center;outline:none}
.lock-btn{margin-top:20px;background:transparent;border:1px solid #00ff41;color:#00ff41;font-family:'VT323',monospace;font-size:18px;padding:10px 30px;cursor:pointer}
.lock-btn:hover{background:#00ff41;color:#000}
.lock-error{color:#ff0033;margin-top:15px;font-size:16px;opacity:0;transition:opacity .3s}
.lock-error.show{opacity:1}
.container{text-align:center;padding:35px 45px;background:rgba(0,20,0,.92);border:1px solid #00ff41;max-width:680px;width:100%;display:none;position:relative;border-radius:8px;box-shadow:0 0 30px rgba(0,255,65,.4)}
.container::before{content:'[root@terminal ~]#';position:absolute;top:-12px;left:20px;background:#000;padding:0 10px;font-size:13px}
.nama{font-size:22px;margin-bottom:15px;letter-spacing:4px}
.waktu{font-size:clamp(36px,7vw,64px);margin-bottom:8px;text-shadow:0 0 15px #00ff41}
.tanggal{font-size:14px;color:#00aa33;letter-spacing:2px;margin-bottom:20px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:15px;font-size:12px;text-align:left;color:#00ff41}
.info-item{background:rgba(0,255,65,.05);padding:6px;border-left:2px solid #00ff41}
.info-label{color:#00aa33;display:block;margin-bottom:2px;font-size:11px}
.command-line{background:rgba(0,0,0,.5);border-top:1px solid #00ff41;padding-top:12px;margin-top:12px;text-align:left}
.cmd-input{width:100%;background:#000;border:none;color:#00ff41;font-family:'VT323';font-size:14px;padding:6px;outline:none}
.cmd-input::placeholder{color:#006622}
.log-container{height:110px;overflow-y:auto;background:#000;padding:8px;margin-top:8px;border:1px solid #003300;font-size:11px;text-align:left;color:#00ff41}
.status{margin-top:12px;font-size:12px}
.status span{display:inline-block;width:6px;height:6px;background:#00ff41;border-radius:50%;margin-right:5px;box-shadow:0 0 8px #00ff41}
.btn-group{display:flex;gap:8px;margin-top:8px;justify-content:center;flex-wrap:wrap}
.btn{background:transparent;border:1px solid #00ff41;color:#00ff41;padding:6px 12px;font-size:11px;cursor:pointer;font-family:'VT323';border-radius:4px}
.btn:hover{background:#003300}
.theme-toggle{position:absolute;top:10px;right:10px;background:transparent;border:1px solid #00ff41;color:#00ff41;padding:4px 8px;font-size:11px;cursor:pointer;font-family:'VT323'}
body.red-theme{background:#110000}
body.red-theme .container{border-color:#ff0033}
body.red-theme .nama,body.red-theme .waktu,body.red-theme .status,body.red-theme .theme-toggle,body.red-theme .btn{color:#ff0033}
body.red-theme .info-label,body.red-theme .cmd-input,body.red-theme .log-container{color:#ff0033}
body.red-theme .info-item,body.red-theme .command-line{background:rgba(255,0,51,.05);border-left-color:#ff0033}
body.blue-theme{background:#000011}
body.blue-theme .container{border-color:#008aff}
body.blue-theme .nama,body.blue-theme .waktu,body.blue-theme .status,body.blue-theme .theme-toggle,body.blue-theme .btn{color:#008aff}
body.blue-theme .info-label,body.blue-theme .cmd-input,body.blue-theme .log-container{color:#008aff}
body.blue-theme .info-item,body.blue-theme .command-line{background:rgba(0,138,255,.05);border-left-color:#008aff}
@media(max-width:600px){.container{padding:25px 15px}.waktu{font-size:44px}.nama{font-size:18px}.info-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<img id="wallpaper" alt="">
<canvas id="matrix"></canvas>

<div id="lockScreen">
<div style="font-size:50px">💀</div>
<div class="lock-title">ACCESS RESTRICTED</div>
<input type="password" class="lock-input" id="passwordInput" placeholder="ENTER PASSWORD" autocomplete="off" autofocus>
<button class="lock-btn" onclick="checkPassword()">AUTHENTICATE</button>
<div class="lock-error" id="lockError">ACCESS DENIED</div>
<div style="margin-top:15px;font-size:12px;color:#006622">Password: Andar_TE18</div>
</div>

<div class="container" id="mainContainer">
<button class="theme-toggle" onclick="toggleTheme()">THEME</button>
<div class="nama">☠️ ANDAR_TE18 ☠️</div>
<div class="waktu" id="jam">00:00:00</div>
<div class="tanggal" id="tanggal">LOADING...</div>
<div class="info-grid">
<div class="info-item"><span class="info-label">IP ADDRESS</span><span id="ip">LOADING...</span></div>
<div class="info-item"><span class="info-label">LOCATION</span><span id="location">SCANNING...</span></div>
<div class="info-item"><span class="info-label">BATTERY</span><span id="battery">CHECKING...</span></div>
<div class="info-item"><span class="info-label">UPTIME</span><span id="uptime">00:00:00</span></div>
</div>
<div class="command-line">
<input type="text" class="cmd-input" id="cmdInput" placeholder="$ type 'help' for commands" onkeypress="handleCmd(event)">
<div class="log-container" id="logContainer"></div>
</div>
<div class="btn-group">
<button class="btn" onclick="exportLog()">EXPORT LOG</button>
<button class="btn" onclick="document.getElementById('wallpaperInput').click()">WALLPAPER</button>
<input type="file" id="wallpaperInput" accept="image/*" style="display:none" onchange="setWallpaper(event)">
<button class="btn" onclick="clearLog()">CLEAR LOG</button>
<button class="btn" onclick="logout()">LOGOUT</button>
</div>
<div class="status"><span></span>SYSTEM ONLINE</div>
</div>

<script>
// ===== v2.4 FIXED - SIMPLE & WORKING =====
const PASSWORD = 'Andar_TE18';
let attempts = 0;
let startTime = Date.now();

function checkPassword(){
  const input = document.getElementById('passwordInput');
  const err = document.getElementById('lockError');
  const val = input.value.trim();

  // DEBUG: buka console (F12) kalau mau liat
  console.log('Input:', val, 'Expected:', PASSWORD);

  if(val === PASSWORD){
    // SUKSES
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('mainContainer').style.display = 'block';
    addLog('ACCESS GRANTED - Welcome back, Andar_TE18');
    addLog('System v2.4 FIXED loaded successfully');
    document.getElementById('cmdInput').focus();
    if(navigator.vibrate) navigator.vibrate([50,50,100]);
  } else {
    // GAGAL
    attempts++;
    err.classList.add('show');
    err.textContent = 'ACCESS DENIED - Percobaan ke-' + attempts;
    input.value = '';
    input.focus();
    if(navigator.vibrate) navigator.vibrate(200);
    setTimeout(()=> err.classList.remove('show'), 2000);
    if(attempts >= 5){
      alert('Terlalu banyak percobaan salah. Refresh halaman!');
      input.disabled = true;
    }
  }
}

function logout(){
  document.getElementById('mainContainer').style.display = 'none';
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('passwordInput').value = '';
  document.getElementById('passwordInput').focus();
  attempts = 0;
}

// Enter di password langsung login
document.getElementById('passwordInput').addEventListener('keypress', function(e){
  if(e.key === 'Enter') checkPassword();
});

// Jam + Tanggal
function updateClock(){
  const now = new Date();
  document.getElementById('jam').textContent = now.toLocaleTimeString('id-ID', {hour12:false});
  document.getElementById('tanggal').textContent = now.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'}).toUpperCase();
  const diff = Math.floor((Date.now() - startTime)/1000);
  const h = String(Math.floor(diff/3600)).padStart(2,'0');
  const m = String(Math.floor((diff%3600)/60)).padStart(2,'0');
  const s = String(diff%60).padStart(2,'0');
  document.getElementById('uptime').textContent = h+':'+m+':'+s;
}
setInterval(updateClock, 1000);
updateClock();

// Fake IP + Location
setInterval(()=>{
  document.getElementById('ip').textContent = Math.floor(Math.random()*200+10)+'.'+Math.floor(Math.random()*200)+'.'+Math.floor(Math.random()*200)+'.'+Math.floor(Math.random()*200);
  const cities = ['YOGYAKARTA','JAKARTA','SINGAPORE','TOKYO','BANDUNG'];
  document.getElementById('location').textContent = cities[Math.floor(Math.random()*cities.length)] + ' - VPN ACTIVE';
}, 5000);
document.getElementById('ip').textContent = '103.45.12.88';
document.getElementById('location').textContent = 'YOGYAKARTA - VPN ACTIVE';
if(navigator.getBattery){
  navigator.getBattery().then(b=>{
    document.getElementById('battery').textContent = Math.round(b.level*100) + '% ' + (b.charging ? '(CHARGING)' : '');
  });
} else {
  document.getElementById('battery').textContent = '100%';
}

// Matrix
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
const chars = '01ANDAR_TE18';
const drops = Array(Math.floor(canvas.width/16)).fill(1);
function drawMatrix(){
  ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#00ff41'; ctx.font = '16px monospace';
  for(let i=0;i<drops.length;i++){
    ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*16, drops[i]*16);
    if(drops[i]*16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 50);

// Terminal
function addLog(t){
  const box = document.getElementById('logContainer');
  const d = document.createElement('div');
  d.textContent = '> ' + t;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function handleCmd(e){
  if(e.key !== 'Enter') return;
  const input = document.getElementById('cmdInput');
  const cmd = input.value.toLowerCase().trim();
  addLog('root@andar:~$ ' + cmd);
  if(cmd === 'help') addLog('help | whoami | hack | scan | clear | logout');
  else if(cmd === 'whoami') addLog('Andar_TE18 - Hacker Pro Yogyakarta');
  else if(cmd === 'hack') addLog('HACK BERHASIL! Target diretas ☠️');
  else if(cmd === 'scan') addLog('Scanning... 3 device ditemukan');
  else if(cmd === 'clear') document.getElementById('logContainer').innerHTML = '';
  else if(cmd === 'logout') logout();
  else if(cmd === '') {}
  else addLog('Perintah tidak ditemukan: ' + cmd);
  input.value = '';
}
function clearLog(){ document.getElementById('logContainer').innerHTML = ''; addLog('Log cleared'); }
function exportLog(){
  const text = document.getElementById('logContainer').innerText;
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'andar-log.txt';
  a.click();
}
function setWallpaper(e){
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  const w = document.getElementById('wallpaper');
  w.src = url; w.style.display = 'block';
  addLog('Wallpaper updated');
}
let themeIdx = 0;
function toggleTheme(){
  const themes = ['', 'red-theme', 'blue-theme'];
  themeIdx = (themeIdx + 1) % themes.length;
  document.body.className = themes[themeIdx];
}
</script>
</body>
</html>
